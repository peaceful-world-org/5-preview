name: Reset preview from production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download current production build
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://5.peaceful-world.org"
          files=(
            ai-guide.js
            analytics.js
            app.js
            apple-touch-icon-v4.png
            boundary-tone.mp3
            brand.css
            completion-polish.css
            copy-rotation.js
            demo.html
            feedback.css
            feedback.js
            five-mark.svg
            i18n.js
            icon-maskable-v4-512.png
            icon-maskable.svg
            icon-v4-192.png
            icon-v4-512.png
            icon.svg
            index.html
            install.css
            ios-guide/part01.b64
            ios-guide/part02.b64
            ios-guide/part03.b64
            ios-guide/part04.b64
            ios-guide/part05.b64
            ios-guide/part06.b64
            ios-install-guide.js
            locales/en.json
            locales/index.json
            locales/ru.json
            logo.svg
            manifest.webmanifest
            minute-end-select.mp3
            minute-start-chime.mp3
            peaceful-world-logo.png
            privacy.en.html
            privacy.html
            sound-v1.js
            step-number.css
            step-number.js
            styles.css
            sw.js
            ui-click-tone.mp3
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            curl --retry 3 --retry-delay 1 -fsSL "$BASE/$file" -o "$file"
            test -s "$file"
          done

      - name: Preserve preview-only utility experiment
        shell: bash
        run: |
          set -euo pipefail
          test -s preview-utilities.js
          cat >> ai-guide.js <<'EOF'

          /* Permanent preview environment: test language/theme utilities without touching production. */
          if (location.hostname === 'preview-5.peaceful-world.org') {
            const utilities = document.createElement('script');
            utilities.src = 'preview-utilities.js?v=1';
            utilities.async = true;
            document.head.appendChild(utilities);
          }
          EOF

      - name: Keep preview custom-domain marker
        run: printf '%s\n' 'preview-5.peaceful-world.org' > CNAME

      - name: Commit preview build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No preview changes to commit."
            exit 0
          fi
          git commit -m "Reset preview from production"
          git push
