name: Pages resolution probe

on:
  workflow_run:
    workflows: ["Deploy preview to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe real GitHub Pages routing
        shell: bash
        run: |
          set -euo pipefail
          base="https://preview-5.peaceful-world.org/pages-probe"
          probe() {
            path="$1"
            tmp="$(mktemp -d)"
            code="$(curl --retry 3 --retry-delay 1 -sS -o "$tmp/body" -D "$tmp/head" -w '%{http_code}' "$base$path")"
            loc="$(grep -i '^location:' "$tmp/head" | tr -d '\r' | cut -d' ' -f2- || true)"
            marker="$(grep -o 'MARKER:[A-Z0-9-]*' "$tmp/body" | head -1 || true)"
            printf '%-18s code=%-3s location=%-32s marker=%s\n' "$path" "$code" "${loc:--}" "${marker:--}"
            rm -rf "$tmp"
          }
          echo "BASE=$base"
          probe "/a"
          probe "/a/"
          probe "/a.html"
          probe "/a/ru"
          probe "/a/ru/"
          probe "/b"
          probe "/b/"
          probe "/b/ru"
          probe "/c"
          probe "/c/"
          probe "/ru"
          probe "/ru/"
          probe "/ru/projects"
          probe "/ru/projects/"
          probe "/contacts/ru"
          probe "/contacts/ru/"

      - name: Assert candidate slashless layout
        shell: bash
        run: |
          set -euo pipefail
          base="https://preview-5.peaceful-world.org/pages-probe"
          check_200_no_redirect() {
            path="$1"; marker="$2"
            tmp="$(mktemp -d)"
            code="$(curl -sS -o "$tmp/body" -D "$tmp/head" -w '%{http_code}' "$base$path")"
            test "$code" = "200"
            ! grep -qi '^location:' "$tmp/head"
            grep -q "MARKER:$marker" "$tmp/body"
            rm -rf "$tmp"
          }
          check_200_no_redirect "/a" "A-FILE"
          check_200_no_redirect "/a/ru" "A-RU"
          check_200_no_redirect "/ru" "RU-HOME"
          check_200_no_redirect "/ru/projects" "RU-PROJECTS"
