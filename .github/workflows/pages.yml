name: Deploy preview to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble isolated Web vNext RC from frozen PR 193
        shell: bash
        run: |
          set -euo pipefail
          ROOT="web-vnext-rc-20261119"
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/sources"
          cp -R "$ROOT/_stage/scripts" "$TMP/sources/scripts"
          cp -R "$ROOT/_stage/web-vnext" "$TMP/sources/web-vnext"
          cp "$ROOT/web-vnext/world.css" "$ROOT/web-vnext/world.js" "$ROOT/web-vnext/roadmap.json" "$TMP/sources/web-vnext/"
          node --check "$TMP/sources/scripts/prepare-web-vnext.mjs"
          node --check "$TMP/sources/scripts/prepare-pages-preview.mjs"
          mkdir -p "$TMP/build"
          cp -R "$ROOT/." "$TMP/build/"
          rm -rf "$TMP/build/_stage"
          node "$TMP/sources/scripts/prepare-web-vnext.mjs" "$TMP/build"
          node "$TMP/sources/scripts/prepare-pages-preview.mjs" "$TMP/build"
          for file in index.html app.js i18n.js sw.js step-number.js web-vnext/world.js; do
            test -s "$TMP/build/$file"
          done
          test -s "$TMP/build/preview-rc-meta.json"
          rm -rf "$ROOT"
          mv "$TMP/build" "$ROOT"
          echo "Assembled isolated Web RC (048dbcc4); no production or native workflows."

      - name: Assemble guest-only My Progress review from PR 206
        shell: bash
        run: |
          set -euo pipefail
          ROOT="progress-v2-review-20261124"
          TMP="$(mktemp -d)"
          node "$ROOT/_stage/build-review.mjs" "$TMP/build"
          for file in index.html progress-v2/preview-runtime.mjs progress-v2/my-progress.mjs progress-v2/local-ledger.mjs review-storage.js review-meta.json; do
            test -s "$TMP/build/$file"
          done
          test ! -e "$TMP/build/sw.js"
          test ! -e "$TMP/build/progress-sync.js"
          test ! -e "$TMP/build/_stage"
          rm -rf "$ROOT"
          mv "$TMP/build" "$ROOT"
          echo "Assembled isolated guest-only My Progress review (261073b). No cloud Auth, analytics, production writes or new service worker."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      # The artifact service used by deploy-pages has intermittently returned
      # zero matches after successful uploads. Use the upload's verified ID
      # with the documented Pages REST deployment API instead.
      - name: Verify uploaded artifact ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          for attempt in $(seq 1 10); do
            if metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME")"; then
              count="$(jq -r '[.artifacts[] | select(.expired == false)] | length' <<< "$metadata")"
              if [ "$count" = "1" ]; then
                jq -e --arg id "$ARTIFACT_ID" --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.expired == false and (.id|tostring)==$id and .name==$name and .size_in_bytes>0 and .size_in_bytes<1073741824)] | length == 1' <<< "$metadata" >/dev/null
                echo "Verified Pages artifact ID $ARTIFACT_ID."
                exit 0
              fi
              if [ "$count" -gt 1 ]; then
                echo "::error::Unexpected duplicate Pages artifact"
                exit 1
              fi
            fi
            sleep 3
          done
          echo "::error::Pages artifact metadata did not become visible"
          exit 1

      - name: Deploy to Pages by verified artifact ID
        id: deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_REPOSITORY" == peaceful-world-org/5-preview ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          umask 077
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          oidc_status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --output "$temp/oidc" --write-out '%{http_code}' \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          if [[ "$oidc_status" != 200 ]] || ! oidc="$(jq -er '.value | select(type=="string" and length>0)' "$temp/oidc" 2>/dev/null)"; then
            echo "::error::GitHub Actions OIDC returned HTTP $oidc_status or an invalid token response"
            exit 1
          fi
          echo "::add-mask::$oidc"
          rm -f "$temp/oidc"
          printf '%s' "$oidc" | jq -Rs --argjson artifact_id "$ARTIFACT_ID" --arg sha "$GITHUB_SHA" \
            '{artifact_id:$artifact_id,pages_build_version:$sha,oidc_token:.,environment:"github-pages"}' > "$temp/payload"
          unset oidc
          endpoint="repos/$GITHUB_REPOSITORY/pages/deployments"
          deployment_id=""
          cancel_pending() {
            if [[ -n "$deployment_id" ]]; then
              gh api --method POST "$endpoint/$deployment_id/cancel" --silent || true
            fi
          }
          trap 'cancel_pending; exit 130' INT TERM

          # Send one deployment request. Never replay a POST with an ambiguous outcome.
          post_result=0
          http_status="$(curl --silent --show-error --connect-timeout 10 --max-time 35 \
            --request POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary "@$temp/payload" --dump-header "$temp/headers" \
            --output "$temp/response" --write-out '%{http_code}' \
            "$GITHUB_API_URL/$endpoint")" || post_result=$?
          rm -f "$temp/payload"
          request_id="$(awk 'tolower($1)=="x-github-request-id:" {gsub(/\r/,"",$2); id=$2} END {print id}' "$temp/headers" 2>/dev/null || true)"
          [[ "$request_id" =~ ^[A-Za-z0-9:-]+$ ]] || request_id=unavailable
          body_bytes=0
          [[ ! -f "$temp/response" ]] || body_bytes="$(wc -c < "$temp/response")"
          echo "Pages create HTTP ${http_status:-000}, curl exit $post_result, $body_bytes response bytes, request $request_id."

          if [[ "$post_result" == 0 && "$http_status" == 201 ]]; then
            if ! deployment_id="$(jq -er '(.id // (.status_url | split("/") | map(select(length>0 and .!="status")) | last)) | tostring | select(length>0)' "$temp/response" 2>/dev/null)"; then
              deployment_id=""
            fi
          fi
          if [[ ! "$deployment_id" =~ ^[A-Za-z0-9_-]+$ ]]; then
            # GitHub identifies the Pages deployment by its build SHA. Check whether an
            # ambiguous response nevertheless created the expected deployment.
            if ! known_status="$(gh api "$endpoint/$GITHUB_SHA" --jq '.status | select(type=="string" and length>0)' 2>/dev/null)" || [[ ! "$known_status" =~ ^[a-z_]+$ ]]; then
              case "$http_status" in
                400) reason='GitHub rejected the deployment request' ;;
                401|403) reason='GitHub rejected authentication or authorization for Pages' ;;
                404) reason='Pages site or API resource was unavailable to this workflow' ;;
                409) reason='GitHub reported a conflicting deployment' ;;
                422) reason='GitHub rejected the artifact, deployment parameters or policy' ;;
                429) reason='GitHub rate-limited the deployment' ;;
                5??) reason='GitHub Pages returned a server error' ;;
                201) reason='GitHub returned an invalid deployment response' ;;
                *) reason='GitHub did not return a usable Pages deployment response' ;;
              esac
              echo "::error::$reason. HTTP ${http_status:-000}, $body_bytes bytes, request $request_id."
              exit 1
            fi
            deployment_id="$GITHUB_SHA"
            echo "Found Pages deployment for this commit after the ambiguous response."
          fi
          printf '%s\n' 'page_url=https://preview-5.peaceful-world.org/' >> "$GITHUB_OUTPUT"
          echo "Created or located Pages deployment $deployment_id for artifact $ARTIFACT_ID."
          for attempt in $(seq 1 60); do
            if status="$(gh api "$endpoint/$deployment_id" --jq '.status' 2>/dev/null)"; then
              echo "Pages status: $status"
              case "$status" in
                succeed)
                  deployment_id=""
                  echo "Reported success."
                  exit 0
                  ;;
                deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost)
                  echo "::error::Pages deployment ended with $status"
                  exit 1
                  ;;
              esac
            fi
            sleep 5
          done
          cancel_pending
          echo "::error::Pages deployment did not reach success within the polling window"
          exit 1
